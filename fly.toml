app = "memebot-ai"
primary_region = "fra"

[build]
  image = "python:3.11-slim"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[processes]
  app = "python main.py"
  watchdog = "python watchdog.py"

[mounts]
  source = "memebot_data"
  destination = "/app/data"

[mounts]
  source = "memebot_models"
  destination = "/app/models"

[mounts]
  source = "memebot_logs"
  destination = "/app/logs"

[[services]]
  protocol = "tcp"
  internal_port = 8080

[[services.ports]]
  port = 80
  handlers = ["http"]
  force_https = true

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[deploy]
  release_command = "python -c 'import os; [os.makedirs(d, exist_ok=True) for d in [\"models\", \"logs\", \"data\"]]'"
